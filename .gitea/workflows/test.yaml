name: Test Rust project
on:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]

    steps:
    - uses: https://git.oliveratkinson.net/Oliver/setup-rust-action@master
      with:
        rust-version: ${{ matrix.rust }}
    - uses: actions/checkout@master
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy
    - name: Build
      run: cargo build -r

    - name: Upload Build
      uses: actions/upload-artifact@v3
      with:
        name: neoscim
        path: |
          target/release/neoscim


